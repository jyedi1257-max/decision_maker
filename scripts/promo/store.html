<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>결정 노트 스토어 이미지 무대</title>
<!--
  Play 스토어 이미지 무대. store-assets.mjs가 이 페이지를 열고 window.show(...)로
  한 장씩 그린 뒤 찍는다. 색·서체는 docs/design-system.md 값만 쓴다.
  감성 컬러는 마스킹테이프(스티커)로만 나온다.
-->
<style>
@font-face { font-family: 'Gowun Batang'; font-weight: 400; src: url('/node_modules/@fontsource/gowun-batang/files/gowun-batang-korean-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'Gowun Batang'; font-weight: 700; src: url('/node_modules/@fontsource/gowun-batang/files/gowun-batang-korean-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'Gowun Batang'; font-weight: 700; src: url('/node_modules/@fontsource/gowun-batang/files/gowun-batang-latin-700-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: 'IBM Plex Sans KR'; font-weight: 400; src: url('/node_modules/@fontsource/ibm-plex-sans-kr/files/ibm-plex-sans-kr-korean-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans KR'; font-weight: 400; src: url('/node_modules/@fontsource/ibm-plex-sans-kr/files/ibm-plex-sans-kr-latin-400-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: 'PenInk'; src: url('/assets/fonts/source/KCC-Kimhwanki.otf') format('opentype'); }

:root {
  --desk: #efece5; --paper: #faf9f6; --rule: #eae7df; --ink: #23201c; --soft: #5a554c;
  --pen: #b3402b; --margin-line: rgba(179, 64, 43, 0.22);
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow: hidden; }
body {
  position: relative;
  background: var(--paper);
  color: var(--ink);
  font-family: 'IBM Plex Sans KR', sans-serif;
  -webkit-font-smoothing: antialiased;
}
.ruled { background-image: repeating-linear-gradient(to bottom, transparent 0 62px, var(--rule) 62px 64px); }
.margin::before { content: ''; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--margin-line); left: var(--mx, 76px); }
.title { font-family: 'Gowun Batang', serif; font-weight: 700; letter-spacing: -0.01em; }
.sticker { position: absolute; display: block; filter: drop-shadow(0 2px 2.4px rgba(35, 32, 28, 0.16)); }
.tape { position: absolute; display: block; }
.phone { position: absolute; background: var(--ink); box-shadow: 0 30px 60px rgba(35, 32, 28, 0.18), 0 6px 14px rgba(35, 32, 28, 0.12); }
.phone .screen { position: relative; overflow: hidden; background: var(--desk); height: 100%; }
.phone img { display: block; width: 100%; }
.under { position: absolute; overflow: visible; }
.under path { fill: none; stroke: var(--pen); stroke-width: 7; stroke-linecap: round; }

/* 휴대전화 스크린샷 1080×1920 */
#shot { width: 1080px; height: 1920px; }
#shot h1 { position: absolute; left: 124px; top: 150px; right: 80px; margin: 0; font-size: 74px; line-height: 1.3; word-break: keep-all; }
#shot h1 .l { display: block; }
#shot p { position: absolute; left: 126px; top: 360px; right: 90px; margin: 0; font-size: 36px; line-height: 1.55; color: var(--soft); word-break: keep-all; }
#shot .phone { left: 224px; top: 540px; width: 632px; height: 1330px; border-radius: 74px; padding: 16px; }
#shot .screen { border-radius: 58px; }

/* 그래픽 이미지 1024×500 */
#feature { width: 1024px; height: 500px; --mx: 56px; }
#feature .icon { position: absolute; left: 100px; top: 96px; width: 132px; height: 132px; border-radius: 30px; box-shadow: 0 10px 24px rgba(35, 32, 28, 0.14); }
#feature .name { position: absolute; left: 96px; top: 250px; font-size: 76px; line-height: 1; }
#feature .ink { position: absolute; left: 100px; top: 356px; font-family: 'PenInk', serif; font-size: 44px; color: var(--pen); white-space: nowrap; }
#feature .phone { left: 640px; top: 58px; width: 316px; height: 665px; border-radius: 40px; padding: 9px; transform: rotate(6deg); }
#feature .screen { border-radius: 32px; }
</style>
</head>
<body>

<div id="shot" class="ruled margin" hidden>
  <h1 class="title" id="shotTitle"></h1>
  <svg class="under" id="shotUnder" height="20"><path/></svg>
  <p id="shotSub"></p>
  <div class="phone"><div class="screen"><img id="shotImg" alt=""></div></div>
  <img class="tape" id="tapeA" alt="" style="width: 170px; left: 150px; top: 560px; rotate: -32deg">
  <img class="tape" id="tapeB" alt="" style="width: 150px; left: 772px; top: 1796px; rotate: -24deg">
</div>

<div id="feature" class="ruled margin" hidden>
  <div class="phone"><div class="screen"><img id="featImg" alt=""></div></div>
  <img class="tape" src="/src/assets/stickers/tape-rose-dots.svg" alt="" style="width: 118px; left: 596px; top: 50px; rotate: -26deg">
  <img class="icon" src="/public/icons/icon-512.png" alt="">
  <img class="sticker" src="/src/assets/stickers/plane-cut.svg" alt="" style="width: 86px; left: 262px; top: 110px; rotate: 180deg">
  <div class="name title">결정 노트</div>
  <div class="ink">적을수록 고민이 적어집니다</div>
</div>

<script>
const $ = (s) => document.querySelector(s)

async function ready() {
  await Promise.all([
    document.fonts.load('700 74px "Gowun Batang"', '가나다'),
    document.fonts.load('400 36px "IBM Plex Sans KR"', '가나다'),
    document.fonts.load('44px PenInk', '적을수록 고민이 적어집니다'),
  ])
  await Promise.all([...document.images].filter((i) => i.src).map((i) => i.decode().catch(() => {})))
}

/** 손으로 그은 듯한 밑줄 — 영상(stage.html)과 같은 모양 */
function underline(svg, target) {
  const r = target.getBoundingClientRect()
  const w = r.width
  svg.style.left = `${r.left}px`
  svg.style.top = `${r.bottom - 8}px`
  svg.setAttribute('width', w + 8)
  svg.querySelector('path').setAttribute('d', `M4 12 C ${w * 0.3} 6, ${w * 0.62} 16, ${w} 9`)
}

window.show = async (kind, d) => {
  $('#shot').hidden = kind !== 'shot'
  $('#feature').hidden = kind !== 'feature'
  if (kind === 'shot') {
    document.body.style.width = '1080px'
    // 줄은 직접 끊는다 — 한국어는 자동 줄바꿈이 어절 한가운데를 자르기 쉽다
    $('#shotTitle').innerHTML = d.title.map((l) => `<span class="l"><span class="w">${l}</span></span>`).join('')
    $('#shotSub').textContent = d.sub
    $('#shotImg').src = d.image
    $('#tapeA').src = `/src/assets/stickers/${d.tapes[0]}.svg`
    $('#tapeB').src = `/src/assets/stickers/${d.tapes[1]}.svg`
    await ready()
    // 제목이 두 줄이면 보조 설명을 그만큼 내린다
    const h = $('#shot h1').getBoundingClientRect()
    $('#shotSub').style.top = `${h.bottom + 26}px`
    const under = $('#shotUnder')
    under.style.display = d.underline ? 'block' : 'none'
    if (d.underline) underline(under, [...document.querySelectorAll('#shotTitle .w')].pop())
  } else {
    document.body.style.width = '1024px'
    $('#featImg').src = d.image
    await ready()
  }
}
</script>
</body>
</html>
